<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTubing Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #c { display: block; width: 100%; height: 100%; }
    #status {
      position: fixed; top: 8px; left: 8px;
      font: 14px monospace; color: #6f6;
      text-shadow: 0 0 4px #000; pointer-events: none;
      opacity: 0.7;
    }
    #cam {
      position: fixed; bottom: 12px; right: 12px;
      width: 240px; height: auto;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      pointer-events: none;
      max-height: 40vh;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
      "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <img id="cam" src="/camera" alt="webcam" />
  <div id="status">connecting...</div>
  <script type="module" src="/avatar.js?v=2"></script>
</body>
</html>
