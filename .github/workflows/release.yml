name: release

# Release pipeline: builds the C++ VTuber pipeline on Windows, macOS and
# Linux, packs self-contained bundles (via the pack_release* scripts), and
# attaches them to a GitHub release.
#
# Trigger from the Actions tab, or:
#   gh workflow run release.yml -f version=v0.4.0
#   (optional: -f prerelease=true -f make_latest=false)
#
# Per platform:
#   windows-x64   pack_release.ps1   (exe + DLLs + app-local MSVC CRT)
#   macos-arm64   pack_release.sh    (binary + dylibs + .app bundle)
#   linux-x86_64  pack_release_linux.sh (binary + libs, $ORIGIN rpath)
#
# The Linux build runs in the manylinux_2_28 container (AlmaLinux 8 base,
# glibc 2.28) and statically links libstdc++/libgcc, so the bundle runs on
# every supported x86-64 distro: Ubuntu 20.04+, Debian 11+, RHEL/Rocky/
# Alma 8 & 9, Amazon Linux 2023, openSUSE Leap 15.x+, Fedora, Arch.
# pack_release_linux.sh enforces that baseline (LINUX_PORTABILITY_STRICT=1).
#
# Bundles include the MediaPipe tracking models and VRM avatars. Each
# platform runs the CTest regression suite (rig solver, springbones,
# expression-driven render pixel diffs, VRM 1.0 loader) and smoke-tests
# its build (renderer benchmark everywhere; plus a headless vtuber_live
# run on Linux/macOS) before packing, and the pack scripts verify the
# staged bundle is self-contained.
#
# Windows binaries are not Authenticode-signed here (certificate secrets
# are not wired into CI); sign locally with pack_release.ps1 -SignPfx if
# needed. macOS bundles are ad-hoc signed by the pack script.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.4.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      make_latest:
        description: "Mark as the latest release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Linux: built in the manylinux_2_28 container for a glibc 2.28 baseline
  # (see the header comment). Static libstdc++/libgcc removes the GLIBCXX
  # runtime requirement entirely.
  build-linux:
    name: build linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Normalize version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"
          echo "PLAIN=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies (mediapipe wheel provides the MediaPipe C library)
        shell: bash
        run: uv sync --frozen

      - name: Download tracking models + VRM avatars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl -fsSL -o assets/models/face_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          curl -fsSL -o assets/models/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          curl -fsSL -o assets/models/pose_landmarker_full.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
          uv run python download_models.py
          ls -la assets/models assets/avatars

      # SDL3 build deps from the AlmaLinux 8 repos (X11, Wayland, audio).
      # EGL/GLES headers are intentionally optional: the renderer is pure
      # software; missing optional deps just disable those SDL backends.
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build patchelf pkg-config \
            libX11-devel libXext-devel libXrandr-devel libXcursor-devel \
            libXfixes-devel libXi-devel libXScrnSaver-devel libXrender-devel \
            libXtst-devel libxkbcommon-devel \
            wayland-devel wayland-protocols-devel \
            mesa-libEGL-devel mesa-libGLES-devel \
            dbus-devel systemd-devel \
            pulseaudio-libs-devel alsa-lib-devel
          cmake --version
          c++ --version

      - name: Configure + build (static C++ runtime for distro independence)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build cpp/build -j

      # ---------- Regression tests ----------
      - name: Run regression tests (CTest)
        shell: bash
        run: |
          set -euo pipefail
          cd cpp/build
          ctest --output-on-failure

      # ---------- Smoke tests ----------
      - name: Smoke test renderer benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd cpp/build
          ./vtuber_cpu --bench 2 --ss 1

      - name: Smoke test live pipeline headless
        shell: bash
        run: |
          set -euo pipefail
          cd cpp/build
          SDL_VIDEODRIVER=dummy ./vtuber_live --verbose --no-pip --fps 15 2> smoke.log &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::vtuber_live exited early"
            wait "$pid" || true
            tail -20 smoke.log || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          tail -5 smoke.log
          grep -q "fps," smoke.log || { echo "::error::no fps output from vtuber_live"; exit 1; }

      # ---------- Package ----------
      - name: Pack bundle
        shell: bash
        # STRICT: fail if the bundle would not run on glibc 2.28 systems.
        run: LINUX_PORTABILITY_STRICT=1 cpp/pack_release_linux.sh -v "$PLAIN"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-linux-x86_64
          # Only the packed archive — the pack script also leaves its
          # staging directory under dist/, which must not enter the
          # artifact.
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            ext: zip
          - name: macos-arm64
            os: macos-latest
            ext: zip
    steps:
      - name: Normalize version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"
          echo "PLAIN=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies (mediapipe wheel provides the MediaPipe C library)
        shell: bash
        run: uv sync --frozen

      - name: Download tracking models + VRM avatars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl -fsSL -o assets/models/face_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          curl -fsSL -o assets/models/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          curl -fsSL -o assets/models/pose_landmarker_full.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
          uv run python download_models.py
          ls -la assets/models assets/avatars

      # SDL3 needs no manual setup: CMake FetchContent-builds the pinned
      # release-3.4.16 when no system package is found (the default on CI).

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure + build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j

      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & cmake --build cpp/build -j
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ---------- Regression tests ----------
      # Full CTest suite: calibration, expression mapping/gaze/head knobs
      # (test_rig), springbone physics, expression-driven render pixel diffs
      # (test_render; uses the avatar downloaded above), and VRM 1.0 loader
      # parsing against the committed fixture. test_tracker is not wired
      # into CTest (it needs a static image argument).
      - name: Run regression tests (CTest)
        shell: bash
        run: |
          set -euo pipefail
          cd cpp/build
          ctest --output-on-failure

      # ---------- Smoke tests ----------

      - name: Smoke test renderer benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd cpp/build
          BIN=vtuber_cpu
          if [ -f vtuber_cpu.exe ]; then BIN=vtuber_cpu.exe; fi
          "./$BIN" --bench 2 --ss 1

      - name: Smoke test live pipeline headless (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd cpp/build
          # Run ~20s under the dummy video driver (no display/camera in CI),
          # then kill it. Needs --verbose: the app is quiet by default.
          SDL_VIDEODRIVER=dummy ./vtuber_live --verbose --no-pip --fps 15 2> smoke.log &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::vtuber_live exited early"
            wait "$pid" || true
            tail -20 smoke.log || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          tail -5 smoke.log
          grep -q "fps," smoke.log || { echo "::error::no fps output from vtuber_live"; exit 1; }

      # ---------- Package ----------

      - name: Pack bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cpp/pack_release.sh -v "$PLAIN"

      - name: Pack bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: cpp
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File pack_release.ps1 -Version $env:PLAIN
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          # Only the packed archive — the pack scripts also leave their
          # staging directories under dist/, which must not enter the
          # artifact.
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh release create shells out to git to resolve --target; a checkout
      # is required for it to work.
      - uses: actions/checkout@v7

      - name: Normalize version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: Fail if the tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists in $GITHUB_REPOSITORY"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist/
          args=(--title "VTuber CPU $TAG (Windows x64, macOS arm64, Linux x86-64)"
                --generate-notes --target "$GITHUB_SHA")
          if [ "${{ inputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          if [ "${{ inputs.make_latest }}" = "true" ]; then args+=(--latest); else args+=(--latest=false); fi
          # Upload only archives; never staging directories.
          gh release create "$TAG" dist/*.tar.gz dist/*.zip "${args[@]}"
          gh release view "$TAG"
